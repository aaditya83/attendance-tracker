<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance</title>
    <link rel="stylesheet" href="attendance.css">
</head>

<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📋 Attendance Tracker</h1>
                <p>Attendance</p>
            </div>
            <div class="sidebar-user" id="sidebarUser"
                style="display: none; padding: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 1.5rem;">👤</span>
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                            id="sidebarUsername"></div>
                        <div style="font-size: 0.75rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                            id="sidebarEmail"></div>
                    </div>
                    <a href="../profile/profile.html" class="btn-icon" title="Profile"
                        style="padding: 6px 8px; background: rgba(255,255,255,0.14);">⚙️</a>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="../dashboard/index.html">🏠 Dashboard</a>
                <a class="nav-item" href="../subjects/subjects.html">📚 Subjects</a>
                <a class="nav-item active" href="attendance.html">📅 Attendance</a>
                <a class="nav-item" href="../analytics/analytics.html">📈 Analytics</a>
                <a class="nav-item" href="../ai-assistant/ai-assistant.html">🤖 AI Assistant</a>
                <a class="nav-item" href="../profile/profile.html">👤 Profile</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <h2>Attendance</h2>
            </div>
            <div class="card">
                <div class="form-group">
                    <label for="attendanceSubject">Subject</label>
                    <select id="attendanceSubject"></select>
                </div>
                <div class="form-group">
                    <label for="attendanceDate">Date</label>
                    <input type="date" id="attendanceDate">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <div class="radio-group">
                        <label><input type="radio" name="attendanceStatus" value="present" checked> Present</label>
                        <label><input type="radio" name="attendanceStatus" value="absent"> Absent</label>
                    </div>
                    <section class="attendance-history">
                        <h2>Attendance History</h2>

                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Subject</th>
                                        <th>Date</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody id="attendanceTableBody">
                                    <tr>
                                        <td colspan="4">Loading...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
                <button id="markAttendanceBtn" class="btn-primary">Mark Attendance</button>
            </div>
        </main>
    </div>

    <script type="module" src="attendance.js"></script>
</body>

</html>
