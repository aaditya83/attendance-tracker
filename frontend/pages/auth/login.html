<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance Tracker</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">📋</div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to Attendance Tracker</p>
            </div>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="yourusername">
                    <span class="error-message" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-primary btn-full" id="submitBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader hidden">⏳</span>
                </button>

                <div class="error-banner hidden" id="formError"></div>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Create one</a></p>
            </div>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
