<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects</title>
    <link rel="stylesheet" href="subjects.css">
</head>
<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>📋 Attendance Tracker</h1>
                <p>Subjects</p>
            </div>
            <div class="sidebar-user" id="sidebarUser" style="display: none; padding: 12px; background: rgba(255,255,255,0.08); border-radius: 10px; margin-bottom: 8px;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span style="font-size: 1.5rem;">👤</span>
                    <div style="flex: 1; min-width: 0;">
                        <div style="font-weight: 600; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="sidebarUsername"></div>
                        <div style="font-size: 0.75rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="sidebarEmail"></div>
                    </div>
                    <a href="../profile/profile.html" class="btn-icon" title="Profile" style="padding: 6px 8px; background: rgba(255,255,255,0.14);">⚙️</a>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item" href="../dashboard/index.html">🏠 Dashboard</a>
                <a class="nav-item active" href="subjects.html">📚 Subjects</a>
                <a class="nav-item" href="../attendance/attendance.html">📅 Attendance</a>
                <a class="nav-item" href="../analytics/analytics.html">📈 Analytics</a>
                <a class="nav-item" href="../ai-assistant/ai-assistant.html">🤖 AI Assistant</a>
                <a class="nav-item" href="../profile/profile.html">👤 Profile</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="section-header">
                <h2>Subjects</h2>
                <button id="addSubjectBtn" class="btn-primary">+ Add Subject</button>
            </div>

            <div class="modal hidden" id="subjectModal">
                <div class="modal-backdrop"></div>
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Add Subject</h3>
                        <button class="modal-close" id="closeModal">×</button>
                    </div>
                    <form id="subjectForm">
                        <input type="hidden" id="subjectId">
                        <div class="form-group">
                            <label for="subjectName">Subject Name</label>
                            <input id="subjectName" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="subjectFaculty">Faculty</label>
                            <input id="subjectFaculty" name="faculty" required>
                        </div>
                        <div class="form-group">
                            <label for="subjectRequired">Required Attendance (%)</label>
                            <input id="subjectRequired" name="required_attendance" type="number" min="1" max="100" value="75" required>
                        </div>
                        <div class="form-actions">
                            <button type="button" class="btn-secondary" id="cancelModal">Cancel</button>
                            <button type="submit" class="btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Faculty</th>
                            <th>Required %</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTableBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module" src="subjects.js"></script>
</body>
</html>
